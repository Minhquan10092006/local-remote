name: localsend_app
description: "LocalSend with Remote Desktop Control"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  refena: ^3.5.0
  refena_flutter: ^3.5.0
  flutter_rust_bridge: ^2.12.0
  localsend_isolates:
    path: ../packages/localsend_isolates
  flutter_webrtc: ^0.12.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

