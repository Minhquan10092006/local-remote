[package]
name = "rust_lib_localsend_app"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
localsend_core = { path = "../../core" }
flutter_rust_bridge = "=2.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
log = "0.4"
lazy_static = "1.4"

