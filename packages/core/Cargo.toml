[package]
name = "localsend_core"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"
anyhow = "1.0"
sha2 = "0.10"
rand = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.2" }
clipboard-win = "5.0"

[dev-dependencies]
tokio-test = "0.4"

